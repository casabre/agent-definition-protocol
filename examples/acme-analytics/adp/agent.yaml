adp_version: "0.3.0"
id: "agent.acme.analytics"
name: "Acme Analytics Agent"
description: "Answers analytic questions over Acme telemetry and metrics."
owner: "acme-labs"
tags: ["analytics", "demo", "telemetry"]
runtime:
  execution:
    - backend: "python"
      id: "acme-python-agent"
      entrypoint: "acme_agents.main:app"
      env:
        ACME_ENV: "dev"
  models:
    - id: "gpt4-planner"
      provider: "openai"
      model: "gpt-4o"
    - id: "gpt4-synth"
      provider: "openai"
      model: "gpt-4o"
flow:
  id: "acme.analytics.flow"
  graph:
    nodes:
      - id: "input"
        kind: "input"
      - id: "planner"
        kind: "llm"
        model_ref: "gpt4-planner"
        runtime_ref: "acme-python-agent"
      - id: "executor"
        kind: "tool"
        runtime_ref: "acme-python-agent"
      - id: "synthesizer"
        kind: "llm"
        model_ref: "gpt4-synth"
        runtime_ref: "acme-python-agent"
      - id: "output"
        kind: "output"
    edges:
      - from: "input"
        to: "planner"
      - from: "planner"
        to: "executor"
      - from: "executor"
        to: "synthesizer"
      - from: "synthesizer"
        to: "output"
    start_nodes: ["input"]
    end_nodes: ["output"]
skills:
  - id: "answer"
    name: "Answer telemetry questions"
    description: "Provide concise answers using indexed telemetry metrics."
    tags: ["qa", "metrics"]
    examples:
      - "What is the p95 latency for service api?"
    input_modes: ["text"]
    output_modes: ["text"]
    visibility: "public"
  - id: "export-raw"
    name: "Export raw telemetry data"
    description: "Export raw metric data as CSV or JSON for authenticated callers."
    tags: ["export", "metrics"]
    input_modes: ["text"]
    output_modes: ["application/json", "text/csv"]
    visibility: "authenticated"
interop:
  a2a:
    # ref: "./docs/agentcard.json"  # old pattern — kept as comment for reference
    card_url: "https://agent.acme.example.com/.well-known/agent.json"
    agent_card:
      name: "Acme Analytics Agent"
      description: "Answers analytic questions over Acme telemetry and metrics"
      url: "https://agent.acme.example.com/"
      version: "1.0.0"
      capabilities:
        streaming: false
        push_notifications: false
        state_transition_history: false
      authentication:
        schemes: ["Bearer"]
      default_input_modes: ["text/plain"]
      default_output_modes: ["application/json"]
    authenticated_extension:
      capabilities:
        push_notifications: true
      authentication:
        schemes: ["Bearer", "oauth2"]
        oauth2:
          authorization_url: "https://auth.acme.example.com/oauth2/authorize"
          token_url: "https://auth.acme.example.com/oauth2/token"
          scopes: ["analytics:read", "analytics:export"]
      push_notification_config:
        endpoint: "https://agent.acme.example.com/notifications"
        auth_scheme: "Bearer"
tools:
  mcp_servers:
    - id: "metrics-mcp"
      description: "Access metrics over MCP"
      transport: "stdio"
      endpoint: "bin/metrics-mcp"
  http_apis:
    - id: "metrics-api"
      description: "REST API for metrics"
      base_url: "https://api.acme.example"
      auth:
        scheme: "bearer"
        env_var: "METRICS_TOKEN"
  sql_functions:
    - id: "analytics.fn_latency"
      description: "Returns latency percentiles"
      connection: "postgresql://telemetry:***@db.acme.local:5432/metrics"
      schema: "analytics"
memory:
  provider: "pinecone"
  endpoint: "https://acme-pinecone.example"
  index: "telemetry"
  namespace: "default"
evaluation:
  suites:
    - id: "regression_basic"
      description: "Basic regression checks"
      metrics:
        - id: "deterministic-basic"
          type: "deterministic"
          function: "acme_evals.regression_basic"
          rubric: "Return stable answers"
          scoring: "boolean"
          threshold: true
    - id: "groundedness_q1"
      description: "Groundedness"
      metrics:
        - id: "llm-judge"
          type: "llm_judge"
          model: "gpt-4o"
          rubric: "Grounded with citations"
          scoring: "average"
          threshold: 0.8
kpis:
  - id: "accuracy-core"
    name: "Core accuracy"
    description: "Accuracy across core regression suite"
    url: "https://dash.acme.example/kpi/accuracy-core"
    target: 0.9
    unit: "ratio"
telemetry:
  endpoint: "https://otel.acme.example/v1"
  protocol: "http/protobuf"
  service_name: "acme-analytics"
  required_attributes:
    - "gen_ai.system"
    - "gen_ai.request.model"
    - "gen_ai.usage.input_tokens"
    - "gen_ai.usage.output_tokens"

governance:
  identity: "spn:acme-agents/analytics"
  allowed_data_scopes: ["metrics.telemetry", "logs.sanitized"]
  forbidden_data_scopes: ["pii.raw"]
  guardrail_policy_set: "./policies/guardrails.json"
deployment:
  environments:
    - name: "dev"
      endpoint: "https://dev.agents.acme.example/analytics"
    - name: "prod"
      endpoint: "https://agents.acme.example/analytics"

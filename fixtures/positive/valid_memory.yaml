adp_version: "0.3.0"
id: "valid-memory-example"
runtime:
  execution:
    - id: "primary"
      backend: "python"
      entrypoint: "main.py"
  models:
    - id: "primary"
      provider: "openai"
      model: "gpt-4o"
flow:
  id: "main"
  graph:
    nodes:
      - id: "input"
        kind: "input"
      - id: "output"
        kind: "output"
    edges: []
    start_nodes: ["input"]
    end_nodes: ["output"]
workspace:
  root: "/tmp/workspace"
# Legacy memory format (v0.1.x) - still valid in v0.3.0
memory:
  provider: "qdrant"
  endpoint: "http://localhost:6333"
  index: "agent-knowledge"

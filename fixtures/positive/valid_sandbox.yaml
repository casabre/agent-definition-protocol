adp_version: 0.3.0
id: valid-sandbox-example
runtime:
  execution:
  - id: primary
    backend: python
    entrypoint: main.py
  models:
  - id: primary
    provider: openai
    model: gpt-4o
flow:
  id: main
  graph:
    nodes:
    - id: input
      kind: input
    - id: sandbox-node
      kind: tool
      tool_ref: python-exec
    - id: output
      kind: output
    edges:
    - from: input
      to: sandbox-node
    - from: sandbox-node
      to: output
    start_nodes:
    - input
    end_nodes:
    - output
workspace:
  root: /tmp/agent-workspace
tools:
  sandbox:
  - id: python-exec
    runtime: python
    version: '3.11'
    image: python:3.11-slim
    provider: docker
    policy:
      timeout_ms: 30000
      max_output_bytes: 1048576
      network: none
      allow_filesystem_writes: false
    mounts:
    - source: workspace
      target: /workspace
      read_only: false
    env:
      PYTHON_PATH: /workspace
    snapshot:
      enabled: true
      restore_on: failure
  - id: node-exec
    runtime: node
    version: '20'
    provider: e2b
    policy:
      timeout_ms: 60000
      network: host

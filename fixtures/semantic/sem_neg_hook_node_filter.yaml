adp_version: "0.3.0"
id: "agent.test.hook-node-filter"
runtime:
  execution:
    - id: "python-exec"
      backend: "python"
      entrypoint: "main.py"
  models:
    - id: "gpt-4o"
      provider: "openai"
      model: "gpt-4o"
flow:
  graph:
    nodes:
      - id: "chat-llm"
        kind: "llm"
        model_ref: "gpt-4o"
    edges: []
    start_nodes: ["chat-llm"]
    end_nodes: ["chat-llm"]
evaluation:
  suites:
    - id: "basic"
      metrics:
        - id: "acc"
          type: "deterministic"
hooks:
  - event: "on_node_end"
    node_filter: ["nonexistent-node-id"]
    handler:
      type: "function"
      function_ref: "mymodule:handler"

adp_version: "0.3.0"
id: "test-cache-keyfields"
runtime:
  execution:
    - id: "primary"
      backend: "python"
      entrypoint: "main.py"
  models:
    - id: "primary"
      provider: "openai"
      model: "gpt-4o"
flow:
  id: "main"
  graph:
    nodes:
      - id: "input"
        kind: "input"
      - id: "output"
        kind: "output"
    edges: []
    start_nodes: ["input"]
    end_nodes: ["output"]
evaluation: {}
tools:
  http_apis:
    - id: "bad-cache"
      description: "API with bad cache key"
      base_url: "https://api.example.com"
      policy:
        cache:
          enabled: true
          key_fields: ["user$name", "data[0].id"]  # Check 17: invalid dot-path

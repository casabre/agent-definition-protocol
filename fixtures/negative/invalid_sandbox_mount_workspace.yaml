adp_version: "0.3.0"
id: "test-sandbox-mount-workspace"
runtime:
  execution:
    - id: "primary"
      backend: "python"
      entrypoint: "main.py"
  models:
    - id: "primary"
      provider: "openai"
      model: "gpt-4o"
flow:
  id: "main"
  graph:
    nodes:
      - id: "input"
        kind: "input"
      - id: "sandbox-node"
        kind: "tool"
        tool_ref: "python-exec"
      - id: "output"
        kind: "output"
    edges:
      - from: "input"
        to: "sandbox-node"
      - from: "sandbox-node"
        to: "output"
    start_nodes: ["input"]
    end_nodes: ["output"]
evaluation: {}
tools:
  sandbox:
    - id: "python-exec"
      runtime: "python"
      provider: "docker"
      policy:
        timeout_ms: 10000
      mounts:
        - source: "workspace"  # Check 28: references workspace but none declared
          target: "/workspace"

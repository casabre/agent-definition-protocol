adp_version: "0.3.0"
id: "test-memory-compaction-exceeds"
runtime:
  execution:
    - id: "primary"
      backend: "python"
      entrypoint: "main.py"
  models:
    - id: "primary"
      provider: "openai"
      model: "gpt-4o"
flow:
  id: "main"
  graph:
    nodes:
      - id: "input"
        kind: "input"
      - id: "output"
        kind: "output"
    edges: []
    start_nodes: ["input"]
    end_nodes: ["output"]
evaluation: {}
memory:
  working:
    max_tokens: 1000
    compaction_threshold_tokens: 1500  # Check 21c: exceeds max_tokens

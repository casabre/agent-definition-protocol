[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adp-sdk"
version = "0.4.0"
description = "ADP SDK (Python)"
readme = "README.md"
authors = [{name = "ACME"}]
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "pyyaml>=6.0", "jsonschema>=4.21"]

[tool.setuptools]
packages = ["adp_sdk", "adp_sdk.integrations"]

[tool.pytest.ini_options]
addopts = "--cov=adp_sdk --cov-report=term-missing --cov-fail-under=100"

[dependency-groups]
dev = [
    "pytest>=7",
    "pytest-cov>=7.1.0",
    "langgraph>=0.2",
    "pyautogen>=0.4",
    "crewai>=0.63",
    "semantic-kernel>=1.3",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
langgraph = ["langgraph>=0.2"]
autogen = ["pyautogen>=0.4"]
crewai = ["crewai>=0.63"]
semantic-kernel = ["semantic-kernel>=1.3"]
all-integrations = [
    "langgraph>=0.2",
    "pyautogen>=0.4",
    "crewai>=0.63",
    "semantic-kernel>=1.3",
]
